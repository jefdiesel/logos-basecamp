<script id="report-data" type="application/json">{"generated_platform": "Darwin", "summary": {"failed": 0, "passed": 5, "skipped": 0}, "tutorials": [{"meta": {"name": "App-to-app intents: declaring, requesting, and choosing between providers", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# App-to-app intents: declaring, requesting, and choosing between providers\n\n`logos.callModule()` calls a module you name. An **intent** is the other\nshape: you name a *capability* and let the shell find a provider. That is\nwhat lets a second wallet be installed and picked without the calling app\nknowing it exists.\n\nThis doc-test drives the whole path inside the real, shippable Basecamp\nbundle:\n\n1. An app requesting a capability it did **not** declare is refused\n   outright \u2014 `not_declared`, and no provider is ever consulted.\n2. When two installed apps provide the same capability, the shell raises a\n   **chooser**. The requester never sees that list and cannot influence it.\n3. Picking one delivers the request to **that provider only**. The other\n   never learns a request happened.\n\nThe machinery under test is `IntentRegistry` (which reads `provides` and\n`uses` out of each installed app's `metadata.json`), `IntentBroker` (which\nresolves a capability to a provider, mints a dispatch id the requester never\nsees, and routes the answer back), and the shell's chooser dialog.\n\n**What you'll build:** The inspector-enabled Basecamp bundle and the logos-qt-mcp UI driver, three\nhand-written QML-only fixture apps \u2014 one requester and two interchangeable\nproviders of the same intent \u2014 and a headless UI run that proves an\nundeclared request is refused, the chooser appears for the ambiguous case,\nand only the chosen provider receives the request.\n\n\n**What you'll learn:**\n\n- How an app declares what it can do (`provides`) and what it may ask for (`uses`) in `metadata.json`, and why both are arrays of objects rather than plain strings\n- Why an undeclared request fails immediately with `not_declared` while every other failure is delayed\n- What happens when two apps provide the same capability, and why the shell \u2014 not the requester \u2014 draws the chooser\n- How a provider answers with `logos.respond()`, and why answering later is normal\n- {'How to assert cross-app isolation headlessly': 'the positive control and the isolation check belong in the same assertion, or the test passes when nothing works'}\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **Linux, macOS or Windows.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required.\n- **Windows:** the outputs the build steps below link, staged as `bin-bundle-dir-inspector/`, `logos-qt-mcp/` and `intents-fixtures/`, plus Git Bash, Python 3 and Node.js."}, {"execs": [], "md": "## Two files, two readers\n\nAn installed app is a directory under the user dir's `plugins/`. Two of\nits files matter here, and they are read by different things:\n\n| File | Read by | For |\n| --- | --- | --- |\n| `manifest.json` | the package scanner | \"this app exists, it is `ui_qml`, its entry is `Main.qml`\" |\n| `metadata.json` | `IntentRegistry` | `provides` and `uses` |\n\nThat split is why these fixtures need no build, no `.lgx` and no\ncatalog: the shell reads capabilities straight off disk from\n`metadata.json`.\n\n> **The shape catches people out.** Both keys are arrays of **objects**:\n>\n> ```json\n> \"uses\": [{\"intent\": \"test.echo\"}]     \u2190 right\n> \"uses\": [\"test.echo\"]                 \u2190 silently ignored\n> ```\n>\n> A bare string array parses, is discarded, and the request then fails\n> `not_declared` with nothing pointing at the manifest. The shell logs\n> every skipped declaration w TdMGCBS+88ELgDCwAAACAwpjmDKywt7d34pf58+evW7cuSZL/+Z//ucApoyhK0/QCB5l+zFKp1Gw2Z/jrGU3uZZVKJb+VAgAAAHB+Ju80mmLqtqNnnnkmlylzr1enjzmlT03/KwAAAAAXqTOcgQUAAAAAxVHQgBVFURT9/9ocUAUAAAAwZ009xD3Hod/whje8613vWrt27TXXXPOTn/xkcHDwjJfdcMMNWZadOnVq8ovXX399b29v6/z4IAje//73f//7389xbS0OcQcAAAAoiGkOcW9jtenq6tq/f/9jjz22fPnyTZs2feELX7jjjju6u7ufeuqpffv2vf3tb+/u7v7Rj3705je/edWqVVu3bl21atXq1atHRka+8pWvZFl2xgE3bdpUr9d379793HPPtW/lAAAAABRHzrcQbtiw4c4775zy4iuvvFKr1X7pl37pxIkTDz300MaNG6MoWr9+/bZt255++un9+/d/85vfPHXqVKVS2bJlSxRFfX19QRBce+21v/3bv/2ud72rVCq1xrnuuuuOHj368MMP33jjjZNvMAQAAADgdSznHVg/+MEPnn766YlfV69ePW/evJ6enm984xurV69+6qmnkiQZGRm59NJLjx8/fvLkyYkry+Vyf39/T09PvV6vVCpBELz44otf+9rXfvmXf7m/v791zaJFi+bNm9fb23vixIlarXa2exIBAAAAeD3JOWBlWTb57r/nnnvu0Ucfbf0chuE111xTLpcXLVo0OV01Go1FixaNjY1VKpWdO3e+4x3vmDxgHMcTP+/fv3/lypU7duy47bbbRkdH8105AAAAAMXUxkPcFy5cuHDhwueff7716/Hjx4MguOKKK77xjW8MDQ1lWdY6o/3EiRNveMMb9u3bNzo62t/fv2fPnuPHjy9YsKC/v3/dunWVSuU73/nOypUrL7300p07d5bL5VWrVu3atWtyAnvNJh/iHsdxGIYXPiYAAAAA5yvLsmkOcQ97e3snfpk/f35HljRTpVKp2WwGQRCGYRiGaZrmO/7kClYqlZyrBQAAADAr0jRtVaAzauNTCC/cxLqn3JnYDu0eHwAAAICzmb7M/MyeozkVcab8sblv7wIAAABghqYvMz8TsOZUxJkSsOZUvAMAAAAoFDuwzmxKrZv+qDAAAAAA2iRJkvMIWHNqB9bpf6yABQAAANB552wyPxOwxsfH27mYYjn9j7UJCwAAAKDDzrn9KpgSsJrN5hy5izDLsjM+mnF8fHxObUMDAAAAmEVpms5kQ1U05fczZp3Xn2n+zPHx8TlS8QAAAABmUZZlM7wdcGrAGhsba8N6CmeaP7O1OUvDAgAAAGif8yowUwNWmqav+4Y1NjY2/X2CGhYAAABA+6Rpel7tZWrACoJgdHT0dXyWeZIko6Oj57wsy7JGo/E6/h4AAAAAZkWSJOe7c+gMASsIguHh4dflWeZpmg4PD8/8+vHxcRkLAAAAIBdJkjQajRmeezVZ3NPTc/qrWZYlSdLV1RWGYR7LK4RWvXoNYS79qYlXXk9fCwAAAECbZFmWZVmapkmSJEnymvdLdZ3tjSRJhoaGarVaHMevdZEFkiTJhWwrm/i6810VAAAAAOd05lsIW9I0HRwcfB2c6T42NjY4OCg/AQAAAFyMzroDa8Lo6Gij0ahUKqVS6eK6da71MMFzPnMQAAAAgCI7d8AKgiBN05GRkZGRkVKp1NXVFUVRFEVhGBatZ03c6Jem6fj4eLPZnO0VAQAAAHChZhSwJjSbTVUIAAAAgE6a7gwsAAAAAJh1/wtZruhZSEiRLgAAAABJRU5ErkJggg==)\n\nThe unchosen provider has been running all along, and it is not merely ignored \u2014 it is never told. The broker mints a separate dispatch id for the provider it picked, so the requester's own id never leaves its side and no other app sees the request at all.\n\n`test.manual` goes to a fixture that holds the request open until someone clicks. The two providers above answer on a timer, which proves routing but says nothing about *when* the user acts \u2014 and the return trip is defined by that moment.\n\nThe shell has moved the user here and is waiting. Note the ordering the next step depends on: dispatch presents the provider *before* delivering to it, so arriving is not evidence the handler has run \u2014 which is why this gate exists rather than clicking straight away.\n\nAnswering returns the user to the requester \u2014 the same move dispatch made, run backwards. Navigation only: the result still arrives exactly as before, which is what this property shows. A cancel returns them too; the outcome that most wants a way home is the one where the user changed their mind.\n\n`test.handoff` is serviced by the SAME app, holds the request open the same way, and answers with the same `ok:true` on the same button. The only difference is `\"handoff\": true` in its `metadata.json`.\n\nWHEN a provider answers and WHETHER the shell then moves the user are independent. The first is the provider's business \u2014 answer on arrival, or wait for the user, as here. The second is all `handoff` controls.\n\nIdentical completion to the transaction above, opposite navigation. A hand-off's `ok` means \"the thing you sent me here for is done\", not \"send me back\" \u2014 the request existed to put the user here, so returning would undo it. From here the sidebar is the way back, chosen by the user rather than by the shell."}, {"execs": [], "md": "## What this proves\n\n- **Declaration is mandatory.** An app can only request what its own\n  `metadata.json` lists, which bounds its reachable capabilities to a set\n  fixed when the package was built.\n- **The user chooses, not the caller.** The requester named a capability\n  and got an answer; it never learned which apps were offered, and could\n  not have preferred one.\n- **Only the chosen provider hears.** Isolation here is structural, not\n  a matter of the other provider politely ignoring the request.\n\nThe chooser is raised on every ambiguous request. Remembering a pick is\ndeliberately not offered yet: it needs a settings screen to review and\nrevoke from, and a way to mark intents that must never be remembered."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
